# =============================================================================
# Render.com - Infrastructure as Code
# =============================================================================
# Deploy configuration for FLOWerTRACK Backend API
# https://render.com/docs/blueprint-spec
# =============================================================================

services:
  # Backend API Service
  - type: web
    name: flowertrack-api
    runtime: docker
    repo: https://github.com/daniel-kazarnowicz-baumalog/flowertrack
    branch: develop
    dockerfilePath: ./src/backend/Dockerfile
    dockerContext: ./src/backend
    region: frankfurt  # Closest to Poland
    plan: free
    
    # Health check endpoint
    healthCheckPath: /health
    
    # Auto-deploy on push to develop
    autoDeploy: true
    
    # Environment variables (set in Render Dashboard for secrets)
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: PORT
        value: "8080"
      # Frontend URL for CORS
      - key: Frontend__Url
        value: https://daniel-kazarnowicz-baumalog.github.io
      # These should be set in Render Dashboard as secrets:
      # - ConnectionStrings__DefaultConnection
      # - Supabase__Url
      # - Supabase__AnonKey
      # - Supabase__ServiceKey
      # - Supabase__JwtSecret
      # - Jwt__Secret
